<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小厨 · 重构补齐版</title>
<style>
  :root{
    --bg:#FBF7F0; --noise-op:.04; --ink:#3B3833; --ink2:#8A857C; --line:rgba(61,52,38,.09);
    --lettuce:#6D9C55; --lettuce-soft:rgba(109,156,85,.12);
    --corn:#E9B960; --corn-soft:rgba(233,185,96,.16); --tomato:#C4624A; --tomato-soft:rgba(196,98,74,.12);
    --glass:rgba(255,255,255,.68); --glass-strong:rgba(255,255,255,.92);
    --glass-border:rgba(255,255,255,.55); --glass-high:rgba(255,255,255,.95);
    --card:rgba(255,255,255,.72); --track:rgba(97,76,50,.10);
    --shadow:0 18px 40px rgba(97,76,50,.10), 0 2px 6px rgba(97,76,50,.05);
    --tab:0 6px 16px rgba(97,76,50,.14);
    --chill:rgba(109,156,85,.07); --freeze:rgba(140,180,215,.08); --wood:rgba(160,120,80,.06);
    --shelf:rgba(61,52,38,.05);
  }
  [data-theme="dark"]{
    --bg:#221E19; --noise-op:.05; --ink:#F2EAD9; --ink2:#B4AC9D; --line:rgba(255,240,214,.10);
    --lettuce:#A8C78C; --lettuce-soft:rgba(168,199,140,.14);
    --corn:#EFC383; --corn-soft:rgba(239,195,131,.16); --tomato:#D98963; --tomato-soft:rgba(217,137,99,.14);
    --glass:rgba(58,50,40,.66); --glass-strong:#4A4238F2;  /* 夜间高亮面=暖深灰（浅字可读） */
    --glass-border:rgba(255,235,200,.10); --glass-high:rgba(255,235,200,.22);
    --card:rgba(58,50,40,.66); --track:rgba(255,240,214,.12);
    --shadow:0 18px 40px rgba(0,0,0,.38), 0 0 60px rgba(240,200,140,.07);
    --tab:0 8px 20px rgba(0,0,0,.45);
    --chill:rgba(143,175,122,.10); --freeze:rgba(127,168,204,.12); --wood:rgba(160,120,80,.08);
    --shelf:rgba(255,240,214,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
  button{-webkit-user-select:none;user-select:none;touch-action:manipulation;outline:none}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);  /* 全局文字色：夜间继承浅色，杜绝默认黑色字 */
    background:#e9e2d4; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:34px 14px; transition:background .5s ease, color .5s ease}
  [data-theme="dark"] body{background:#171310}
  body::after{content:""; position:fixed; inset:0; pointer-events:none; opacity:var(--noise-op);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>")}

  /* 手机壳 */
  .device{position:relative; width:398px; max-width:100%; border-radius:52px; padding:7px;
    background:linear-gradient(160deg,#fffdf7,#efe6d3);
    box-shadow:0 30px 70px rgba(80,60,35,.28), 0 4px 14px rgba(80,60,35,.12), inset 0 0 0 1px rgba(255,255,255,.6)}
  .device::before{content:""; position:absolute; left:-2px; top:120px; width:3px; height:64px; border-radius:3px; background:rgba(120,95,60,.35)}
  .device::after{content:""; position:absolute; right:-2px; top:150px; width:3px; height:44px; border-radius:3px; background:rgba(120,95,60,.25)}
  .screen{position:relative; border-radius:46px; background:var(--bg); overflow:hidden;
    height:786px; display:flex; flex-direction:column; transition:background .5s ease;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .screen::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:var(--noise-op);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>")}
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:118px; height:26px;
    border-radius:0 0 18px 18px; background:rgba(0,0,0,.85); z-index:30}
  .notch::after{content:""; position:absolute; top:7px; left:50%; transform:translateX(-50%);
    width:9px; height:9px; border-radius:50%; background:#1b2a55; box-shadow:inset 0 0 3px rgba(0,0,0,.8)}

  .viewport{flex:1; overflow:hidden; padding:0 18px; display:flex; flex-direction:column}

  /* 标题栏（贴顶，背景延伸，安全区由 padding 表示） */
  .topbar{display:flex; align-items:center; padding:44px 0 12px; flex:none; position:relative; z-index:5}
  .topbar .grp{display:flex; align-items:center; gap:10px}
  .topbar .t{font-size:24px; font-weight:800}
  .topbar .acts{margin-left:auto; display:flex; gap:9px}
  .circle-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--glass-border);
    border-top-color:var(--glass-high); background:var(--glass); box-shadow:var(--tab); color:var(--ink);
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease}
  .circle-btn:active{transform:scale(.9)}
  .circle-btn.spin{animation:spin .9s cubic-bezier(.4,0,.2,1)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 筛选下拉 */
  .filter-wrap{position:relative}
  .filter-panel{display:none; position:absolute; top:46px; left:0; width:196px; padding:8px; z-index:40;
    background:var(--glass); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:22px; box-shadow:var(--tab); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
  .filter-wrap.open .filter-panel{display:block; animation:fp .22s cubic-bezier(.3,1.2,.5,1)}
  @keyframes fp{from{opacity:0; transform:translateY(-6px) scale(.96)} to{opacity:1; transform:none}}
  .fp-opt{width:100%; border:none; background:none; cursor:pointer; padding:9px 12px; border-radius:10px;
    font-size:13px; font-weight:600; color:var(--ink2); display:flex; align-items:center}
  .fp-opt:hover{color:var(--ink)}
  .fp-opt.on{color:var(--ink); background:var(--lettuce-soft)}
  .fp-opt .cnt{margin-left:auto; font-size:11px; color:var(--ink2); font-weight:400}
  .fp-opt.on .cnt{display:none}
  .fp-opt .ok{margin-left:auto; color:var(--corn); font-weight:800; display:none}
  .fp-opt.on .ok{display:block}

  .scroll{flex:1; overflow-y:auto; scrollbar-width:none; padding-bottom:120px}
  .scroll::-webkit-scrollbar{display:none}
  .page{display:none}
  .page.on{display:flex; flex-direction:column; animation:inp .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes inp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  /* 胶囊 & 跨区横幅 */
  .capsule{display:flex; gap:4px; padding:5px; border-radius:99px; margin-bottom:12px;
    background:var(--glass); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    box-shadow:var(--tab); transition:opacity .25s ease}
  .capsule.off{opacity:.45; pointer-events:none}
  .capsule .tab{flex:1; text-align:center; padding:10px 0; border-radius:99px; font-size:13.5px;
    font-weight:600; color:var(--ink2); cursor:pointer; transition:all .25s ease}
  .capsule .tab.on{background:var(--glass-strong); color:var(--ink); box-shadow:var(--tab); border:1px solid var(--glass-high)}
  .cross-note{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px; margin-bottom:12px;
    background:var(--lettuce-soft); border:1px solid var(--lettuce); font-size:12.5px; font-weight:600}
  .cross-note button{margin-left:auto; border:none; background:none; color:var(--lettuce); font-size:12px; font-weight:700; cursor:pointer}
  .banner{display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:16px; margin-bottom:12px;
    background:var(--corn-soft); border:1px solid var(--corn); font-size:13px; font-weight:600; animation:inp .3s ease}
  .banner .dot{width:8px; height:8px; min-width:8px; border-radius:50%; background:var(--corn); box-shadow:0 0 0 4px var(--corn-soft)}

  /* 库存卡（两列，级联入场） */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:18px 14px; padding:2px 2px 8px; margin:-2px -2px 0}
  .card{background:var(--card); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:22px; box-shadow:0 8px 22px rgba(97,76,50,.09), 0 2px 5px rgba(97,76,50,.05); padding:13px 14px; cursor:pointer;
    animation:cardIn .32s cubic-bezier(.2,.8,.3,1) both; transition:transform .12s ease, background .5s ease}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}}
  .card:active{transform:scale(.97)}
  .card .r1{display:flex; align-items:center; gap:10px}
  .card .tile{width:40px; height:40px; min-width:40px; border-radius:14px; background:var(--lettuce-soft);
    display:flex; align-items:center; justify-content:center; font-size:23px}
  .card .nm{flex:1; min-width:0; font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .card .qt{font-size:13px; font-weight:800; white-space:nowrap}
  .card .r2{display:flex; justify-content:flex-end; align-items:center; gap:6px; margin:7px 0 9px; font-size:11px; color:var(--ink2); font-weight:600}
  .zbadge{font-size:10.5px; font-weight:600; color:var(--corn); background:var(--corn-soft); padding:2px 7px; border-radius:6px}
  .card .fresh{height:6px; border-radius:99px; background:var(--track); overflow:hidden}
  .card .fresh i{display:block; height:100%; border-radius:99px; background:var(--c); width:var(--w)}
  .empty{text-align:center; padding:34px 0; color:var(--ink2); font-size:13px}

  /* 食谱 */
  .switch-line{display:flex; align-items:center; justify-content:space-between; margin-bottom:13px}
  .switch-line .lbl{font-size:13.5px; font-weight:600}
  .switch-line .hint{display:block; font-size:11px; color:var(--ink2); font-weight:400; margin-top:2px}
  .swt{position:relative; display:inline-block; vertical-align:middle; width:46px; height:27px; flex:none; cursor:pointer}
  .swt input{position:absolute; opacity:0}
  .swt .tr{position:absolute; inset:0; border-radius:99px; background:var(--track); border:1px solid var(--line); transition:background .25s}
  .swt .kn{position:absolute; top:3px; left:4px; width:19px; height:19px; border-radius:50%; background:var(--glass-strong); box-shadow:var(--tab); transition:left .25s cubic-bezier(.3,1.2,.5,1)}
  .swt input:checked ~ .tr{background:var(--corn)}
  .swt input:checked ~ .kn{left:22px}
  .r-list{display:flex; flex-direction:column; gap:13px; padding:2px 2px 8px; margin:-2px -2px 0}
  .r-card{background:var(--card); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:22px; box-shadow:0 8px 22px rgba(97,76,50,.09), 0 2px 5px rgba(97,76,50,.05); padding:15px 16px; cursor:pointer;
    animation:cardIn .32s cubic-bezier(.2,.8,.3,1) both; transition:transform .12s ease}
  .r-card:active{transform:scale(.98)}
  .r-head{display:flex; align-items:center; gap:12px}
  .r-head .emo{width:44px; height:44px; min-width:44px; border-radius:50%; background:var(--lettuce-soft);
    display:flex; align-items:center; justify-content:center; font-size:24px}
  .r-head .rn{font-size:15px; font-weight:800}
  .r-head .rt{font-size:11.5px; color:var(--ink2); margin-top:2px}
  .r-badge{margin-left:auto; font-size:10.5px; font-weight:700; color:var(--corn); background:var(--corn-soft);
    border:1px solid var(--corn); padding:3px 9px; border-radius:99px}
  .r-arrow{margin-left:10px; color:var(--ink2); font-size:13px}
  .r-tags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
  .r-tag{font-size:11px; font-weight:600; color:var(--ink2); border:1px solid var(--line); padding:3px 9px; border-radius:8px; background:var(--glass)}

  /* 详情（右滑） */
  #detail{position:absolute; inset:0; z-index:15; background:var(--bg); display:none; flex-direction:column;
    padding:0 18px; animation:slIn .3s cubic-bezier(.2,.8,.3,1)}
  #detail.on{display:flex}
  @keyframes slIn{from{opacity:0; transform:translateX(56px)} to{opacity:1; transform:none}}
  .detail-head{display:flex; align-items:center; padding:44px 0 12px; gap:12px}
  .detail-head .t{font-size:24px; font-weight:800; margin:0 auto}
  #detailScroll{flex:1; overflow-y:auto; scrollbar-width:none; padding-bottom:110px}
  #detailScroll::-webkit-scrollbar{display:none}
  .d-hero{background:var(--card); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:22px; box-shadow:var(--shadow); padding:16px; display:flex; gap:12px; align-items:center; margin-bottom:14px}
  .d-hero .emo{width:52px; height:52px; min-width:52px; border-radius:50%; background:var(--lettuce-soft);
    display:flex; align-items:center; justify-content:center; font-size:28px}
  .d-name{font-size:18px; font-weight:800}
  .d-meta{font-size:12px; color:var(--ink2); margin-top:3px}
  .d-right{margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
  .copy-btn{border:none; cursor:pointer; padding:7px 12px; border-radius:99px; font-size:11.5px; font-weight:700;
    color:var(--lettuce); background:var(--lettuce-soft); border:1px solid var(--lettuce)}
  .step{display:flex; gap:11px; padding:9px 0; align-items:flex-start}
  .step .sn{width:25px; height:25px; min-width:25px; border-radius:50%; background:var(--lettuce-soft);
    color:var(--lettuce); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
  .step .st{font-size:16px; line-height:1.7}
  .ingline{display:flex; align-items:center; gap:10px; padding:7px 0}
  .ingline .nm{font-size:13px; font-weight:700}
  .ingline .ct{font-size:10.5px; color:var(--ink2); margin-top:1px}
  .qty-ctl{margin-left:auto; display:flex; align-items:center}
  .qty-ctl button{width:25px; height:25px; border-radius:50%; border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    background:var(--glass); box-shadow:var(--tab); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer}
  .qty-ctl .val{min-width:56px; text-align:center; font-size:12.5px; font-weight:800}
  .deduct{width:100%; border:none; cursor:pointer; margin-top:12px; padding:13px; border-radius:16px;
    font-size:14px; font-weight:800; color:#fff; background:var(--lettuce); box-shadow:var(--tab)}
  .deduct:active{transform:scale(.97)}

  /* 设置 */
  .set{display:flex; flex-direction:column; gap:11px}
  .set-card{background:var(--card); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:18px; box-shadow:var(--shadow); padding:13px 16px; display:flex; align-items:center; gap:11px; cursor:pointer; transition:background .15s ease}
  .set-card:hover{background:var(--glass-strong)}
  .set-ic{width:38px; height:38px; min-width:38px; border-radius:12px; background:var(--lettuce-soft);
    display:flex; align-items:center; justify-content:center; font-size:18px}
  .set-n{font-size:14px; font-weight:700}
  .set-s{font-size:11.5px; color:var(--ink2); margin-top:2px}
  .right{margin-left:auto}
  .chev{color:var(--ink2); font-size:12px; transition:transform .25s ease}
  input[type=range]{width:150px; accent-color:var(--corn); -webkit-appearance:none; height:6px; border-radius:99px; background:var(--track)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:19px; height:19px; border-radius:50%;
    background:var(--glass-strong); border:1px solid var(--glass-high); box-shadow:var(--tab)}
  .pill-btn{border:none; cursor:pointer; padding:8px 16px; border-radius:99px; font-size:12.5px; font-weight:700; color:#fff; background:var(--lettuce); box-shadow:var(--tab)}
  .dotg{width:8px; height:8px; border-radius:50%; background:var(--lettuce); box-shadow:0 0 0 4px var(--lettuce-soft)}
  /* 下拉 */
  .dropdown-set{display:none}
  .set-card.open .dropdown-set{display:block; animation:inp .22s ease}

  /* 底部导航 */
  .nav{position:absolute; left:14px; right:14px; bottom:16px; z-index:25; display:flex; padding:6px 8px;
    border-radius:22px; background:var(--glass); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    box-shadow:var(--tab); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px)}
  .nav-ind{position:absolute; top:6px; bottom:6px; left:8px; width:calc((100% - 16px)/3);
    background:var(--glass-strong); border:1px solid var(--glass-high); border-radius:16px;
    box-shadow:var(--tab); transition:left .32s cubic-bezier(.3,1.25,.5,1)}
  .nav button{position:relative; z-index:1; flex:1; border:none; background:none; color:var(--ink2); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:700}
  .nav button.on{color:var(--ink)}
  .fab{position:absolute; right:24px; bottom:98px; z-index:24; width:54px; height:54px; border-radius:50%;
    background:var(--glass-strong); border:1px solid var(--glass-high); box-shadow:var(--tab);
    color:var(--corn); font-size:25px; display:flex; align-items:center; justify-content:center; cursor:pointer}
  .fab:active{transform:scale(.9)}
  .fab.hide{opacity:0; pointer-events:none; transform:scale(.8); transition:transform .25s ease, opacity .25s ease}
  /* 数字输入（自由输入 · 一位小数） */
  .num{width:64px; border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    background:var(--glass); border-radius:12px; padding:6px 10px; font-size:14px; font-weight:800;
    color:var(--ink); text-align:center; outline:none; font-family:inherit; appearance:textfield}
  .num:focus{border-color:var(--corn)}
  .num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  /* 悬浮菜单（不压缩下方布局） */
  .dd-wrap{position:relative}
  .menu{position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:60; display:none;
    background:var(--glass); border:1px solid var(--glass-border); border-top-color:var(--glass-high);
    border-radius:16px; box-shadow:var(--tab); padding:8px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
  .dd-wrap.open .menu{display:block; animation:inp .22s ease}
  .homebar{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:110px; height:4px;
    border-radius:99px; background:rgba(0,0,0,.25); z-index:26}

  /* 浮窗 / toast */
  .overlay{position:absolute; inset:0; z-index:40; background:rgba(30,24,18,.32); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; padding:22px}
  .overlay.show{display:flex; animation:fb .22s ease}
  @keyframes fb{from{opacity:0} to{opacity:1}}
  .modal{width:100%; max-width:316px; background:var(--bg); color:var(--ink); border:1px solid var(--glass-high);
    border-radius:24px; box-shadow:var(--shadow); padding:20px; animation:mp .26s cubic-bezier(.3,1.25,.5,1)}
  @keyframes mp{from{transform:scale(.92) translateY(10px); opacity:.6} to{transform:none; opacity:1}}
  .m-head{display:flex; align-items:center; margin-bottom:12px}
  .m-title{font-size:17px; font-weight:800}
  .m-close{margin-left:auto; width:28px; height:28px; border-radius:50%; border:none; background:var(--glass); color:var(--ink2); cursor:pointer}
  .m-label{font-size:12px; font-weight:700; color:var(--ink2); margin:12px 0 8px}
  .chips{display:flex; gap:7px; flex-wrap:wrap}
  .chip{border:none; cursor:pointer; padding:7px 14px; border-radius:99px; font-size:12.5px; font-weight:700;
    color:var(--ink2); background:var(--glass); border:1px solid var(--line); transition:all .18s cubic-bezier(.3,1.2,.5,1)}
  .chip.on{background:var(--glass-strong); color:var(--ink); border-color:var(--corn); box-shadow:var(--tab); transform:scale(1.04)}
  .m-actions{display:flex; gap:10px; margin-top:20px}
  .m-ghost{flex:1; border:none; background:none; color:var(--ink2); font-size:13px; font-weight:700; cursor:pointer}
  .m-danger{flex:1; border:1px solid var(--tomato); background:var(--tomato-soft); color:var(--tomato);
    font-size:13px; font-weight:700; padding:11px; border-radius:14px; cursor:pointer}
  .m-primary{flex:1.2; border:none; background:var(--lettuce); color:#fff; font-size:13.5px; font-weight:800;
    padding:11px; border-radius:14px; box-shadow:var(--tab); cursor:pointer}

  .toast{position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(14px); opacity:0;
    z-index:50; padding:11px 18px; border-radius:99px; font-size:12.5px; font-weight:700; pointer-events:none;
    background:var(--glass-strong); color:var(--ink); border:1px solid var(--glass-high);
    box-shadow:var(--tab);

  /* 规则猜料（演示版；真机由 DeepSeek 返回分类，此为兜底） */
  function guessTag(n){
    var FRU = ['苹果','梨','橙','橘','柚','柠檬','莓','葡萄','提子','香蕉','芒果','榴莲','菠萝','桃','樱桃','猕猴桃','奇异果','山楂','柿子','石榴','枣','枸杞','西瓜','哈密瓜','甜瓜'];
    if (FRU.some(function(k){ return n.indexOf(k) >= 0; })) return '水果';
    if (/椒|菇|菜|豆|茄|芹|韭|蒜|姜|葱|藕|薯|卜|笋|苗|芽|瓜|番茄|西红柿|玉米|豆腐|山药|南瓜|冬瓜|苦瓜|丝瓜|莲藕|菌|海带|皮蛋|.子/.test(n)) return '蔬菜';
    if (/肉|排骨|鸡|鸭|鹅|蛋|火腿|香肠|培根|牛|羊|猪/.test(n)) return '肉蛋';
    if (/鱼|虾|蟹|贝|蛤|蛏|鱿|章|海参|生蚝|鲍|龙虾/.test(n)) return '海鲜';
    if (/奶|酪|芝士|黄油|奶油|酸奶/.test(n)) return '乳品';
    if (/米|面|粉|包|饺|馒|馄饨|年糕|汤圆|粽子|麦/.test(n)) return '主食';
    if (/盐|糖|酱|醋|油|料酒|胡椒|花椒|八角|蚝|味精|鸡精|孜然|咖喱/.test(n)) return '调味';
    if (/可乐|雪碧|咖啡|茶|啤|果汁|橙汁/.test(n)) return '调味';
    return '蔬菜';
  }
  function tagKey(t){ return {蔬菜:'veg',水果:'fru',乳品:'dairy',肉蛋:'meat',海鲜:'froz',主食:'base',调味:'cond',速冻:'froz'}[t] || 'veg'; }
  function localParse(text){
    var out = [];
    text.split(/[，,、和\s]+/).filter(Boolean).forEach(function(p){
      var nm = p.match(/[\u4e00-\u9fa5A-Za-z]+/);
      var name = nm ? nm[0] : p;
      var nums = p.match(/\d+(?:\.\d+)?/);
      var qty = nums ? parseFloat(nums[0]) : 1;
      var um = p.match(/(个|盒|袋|克|瓶|颗|块|把|条|罐|斤|两|勺)/);
      var unit = (um ? um[1] : '个');
      out.push({name: name, qty: qty, unit: unit, cat: guessTag(name), zone: guessZone(guessTag(name))});
    });
    return out;
  }

  /* 演示级联动：扣除真实写入本地库存（真机由桥落库后 setData 回灌） */
  function doDeduct(){

  /* ============ 桥适配层（Capacitor FridgeNative 优先 / AndroidBridge 兼容 / 浏览器静默） ============ */
  (function(){
    var F = null;
    try { if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FridgeNative) F = window.Capacitor.Plugins.FridgeNative; } catch(e){}
    window.bridgeMode = F ? 'capacitor' : (window.AndroidBridge ? 'android' : 'demo');
    window.emit = function(type, payload){

      if (F){ try { F.receiveEvent({type: type, payload: json}); } catch(e){} return; }
      if (window.AndroidBridge){ try { window.AndroidBridge.onEvent(type, json); } catch(e){} }
    };

    };
    function invToDemo(items){
      var out = {chill: [], freeze: [], ambient: []};
      (items || []).forEach(function(it){
        out[it.zone || 'chill'].push({
          n: it.name, q: it.qty, u: it.unit,
          tag: it.tag || '蔬菜', k: it.catKey || 'veg',
          w: parseInt(it.fresh && it.fresh.w) || 100,
          c: (it.fresh && it.fresh.c) || '#5FA45C',
          note: (it.fresh && it.fresh.note) || '很新鲜'
        });
      });
      return out;
    }
    window.setInsets = function(top, bottom){ /* 手机壳演示无感；真机壳按安全区预留 */ };
    window.setAppTheme = function(dark){
      document.body.dataset.theme = dark ? 'dark' : 'light';
      var sw = document.querySelector('#p-set .swt input'); if (sw) sw.checked = !!dark;
    };
    window.setAppMode = function(){ /* 演示壳无需去壳 */ };
    window.handleBack = function(){
      if (window.closeEdit && document.getElementById('ovEdit').classList.contains('show')){ closeEdit(); return true; }
      return false;
    };
    if (F){
      try {
        F.addListener('fridgeData', function(res){ window.setData(res.json); });
        F.addListener('fridgeInsets', function(res){ window.setInsets(res.top, res.bottom); });
        F.addListener('fridgeTheme', function(res){ window.setAppTheme(res.dark); });
        F.ready(); /* 通知原生：页面已就绪，可推送数据/安全区 */
      } catch(e){}
    }
  })();

  console.log('XIAOCHU cap 1.0');

  renderZone(); renderRecipes(); banner(); renderFilter();
</script>
</body>
